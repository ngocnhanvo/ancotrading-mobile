name: ANCO APK-only emulator smoke test

on:
  push:
    branches:
      - test/android-emulator-20261019
    paths:
      - emulator-test/trigger.txt
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk-emulator:
    name: Install unchanged uploaded APK on Android 15 tablet
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout test scripts (no source build)
        uses: actions/checkout@v4

      - name: Retrieve uploaded APK from GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p emulator-results "$RUNNER_TEMP/anco-apk"
          gh release download anco-apk-emulator --repo "$GITHUB_REPOSITORY" --pattern "anco.115.74.201.244.apk" --dir "$RUNNER_TEMP/anco-apk"
          test -s "$RUNNER_TEMP/anco-apk/anco.115.74.201.244.apk"
          echo "17bfa983fd632644292cedb132ffed5e552d15f61de5d16efe2e82f21afad394  $RUNNER_TEMP/anco-apk/anco.115.74.201.244.apk" | sha256sum -c -
          cp "$RUNNER_TEMP/anco-apk/anco.115.74.201.244.apk" "$RUNNER_TEMP/anco-original.apk"
          sha256sum "$RUNNER_TEMP/anco-original.apk" > emulator-results/apk-sha256.txt

      - name: Enable KVM for Android Emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install and launch original APK on Android 15 tablet emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/android-emulator-smoke.sh

      - name: Upload screenshot and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anco-original-apk-android15-tablet
          path: emulator-results/
          if-no-files-found: warn
          retention-days: 7
