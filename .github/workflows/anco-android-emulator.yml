name: ANCO Android 15 emulator smoke test

on:
  push:
    branches:
      - test/android-emulator-20261019
  workflow_dispatch:

permissions:
  contents: read

jobs:
  emulator-smoke:
    name: Source build + Android 15 tablet startup
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout isolated test branch
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: npm

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps --no-audit --no-fund

      - name: Adapt legacy scanner Gradle syntax only inside CI
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('node_modules/react-native-smart-barcode/android/build.gradle')
          s = p.read_text()
          s = s.replace('compileSdkVersion 23', 'compileSdkVersion 34')
          s = s.replace('buildToolsVersion "23.0.3"', '')
          s = s.replace('targetSdkVersion 23', 'targetSdkVersion 34')
          s = s.replace('android {', 'android {\n    namespace "com.reactnativecomponent.barcode"', 1)
          s = re.sub(r'(?m)^(\s*)compile(\s+)', r'\1implementation\2', s)
          p.write_text(s)
          print(p.read_text())
          PY

      - name: Build debug APK from repository source
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Allow hardware acceleration for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Android 15 tablet-like emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          ram-size: 4096M
          heap-size: 512M
          disk-size: 6000M
          emulator-boot-timeout: 900
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back emulated
          script: bash .github/scripts/android-emulator-smoke.sh

      - name: Upload emulator screenshot and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: anco-android15-tablet-test
          path: emulator-results/
          if-no-files-found: warn
          retention-days: 7
