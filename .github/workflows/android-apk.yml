name: Android Release APK

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/android-apk.yml'
      - 'android/**'
      - 'modules2/**'
      - 'App.js'
      - 'index.js'
      - 'package.json'
      - 'package-lock.json'
  workflow_dispatch:

concurrency:
  group: android-apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install required Android SDK packages
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -n 1)"
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0" "ndk;25.1.8937393"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install npm dependencies
        run: npm ci --legacy-peer-deps

      # Older native libraries need a compatible compile configuration and Android SDK.
      - name: Patch legacy Android libraries for Gradle 8
        run: |
          barcode="node_modules/react-native-smart-barcode/android/build.gradle"
          test -f "$barcode"
          sed -i -E 's/^[[:space:]]*compile[[:space:]]+/    implementation /' "$barcode"
          for module in react-native-smart-barcode react-native-print; do
            file="node_modules/$module/android/build.gradle"
            test -f "$file"
            sed -i -E 's/compileSdkVersion[[:space:]]*=?[[:space:]]*[0-9]+/compileSdkVersion 34/g' "$file"
          done

      - name: Build standalone Android release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ancotrading-release-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 14
